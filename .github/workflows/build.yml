name: Build Desktop Apps

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            artifact_path: build/windows/x64/runner/Release
          - os: macos-latest
            platform: macos
            artifact_path: build/macos/Build/Products/Release
          - os: ubuntu-latest
            platform: linux
            artifact_path: build/linux/x64/release/bundle
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev

      - run: flutter pub get

      - run: flutter config --enable-${{ matrix.platform }}-desktop

      - run: flutter build ${{ matrix.platform }} --release

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform }}-build
          path: ${{ matrix.artifact_path }}